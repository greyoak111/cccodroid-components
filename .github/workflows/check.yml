# PR：检查配方格式，并对每个底座解一遍依赖（不打包、不需要任何密钥）
name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: greyoak111/cccodroid
          path: app
          sparse-checkout: devkit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-recipes.mjs
      - run: node --test tests/host-api.test.mjs tests/audit-selection.test.mjs
      - run: node tools/ci-build.mjs --devkit app/devkit --dry

  # 审计：真打一次包（不上传），静态检查产物（tools/audit.mjs）；再在 termux-docker 里实跑 selftest
  # （tools/ci-selftest.mjs）。两份结果并成一条 PR 评论。arm64 机器：termux-docker 要原生跑 bionic
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: greyoak111/cccodroid
          path: app
          sparse-checkout: devkit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 底座文件清单（只列不解，600 多 MB 的包）和 deb 缓存：按底座缓存，同一底座只取一次
      - uses: actions/cache@v4
        with:
          path: |
            work/bases
            app/devkit/cache
          key: audit-${{ hashFiles('bases.json') }}
      - name: 审计
        run: node tools/audit.mjs --devkit app/devkit --changed origin/${{ github.base_ref }} --out audit.md || echo "AUDIT_FAILED=1" >> "$GITHUB_ENV"
      - name: 实跑 selftest
        run: node tools/ci-selftest.mjs --report audit.md || echo "SELFTEST_FAILED=1" >> "$GITHUB_ENV"
      - name: 贴到 PR
        if: always() && hashFiles('audit.md') != ''
        continue-on-error: true          # 来自 fork 的 PR 没有写评论的权限，报告还在 Summary 里
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file audit.md --edit-last || gh pr comment ${{ github.event.pull_request.number }} --body-file audit.md
      - name: 结论
        run: |
          [ -z "$AUDIT_FAILED" ] || { echo "审计有 ❌，见 PR 评论"; exit 1; }
          [ -z "$SELFTEST_FAILED" ] || { echo "selftest 没过，见 PR 评论"; exit 1; }
